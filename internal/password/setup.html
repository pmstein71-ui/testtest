<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="pulse-setup" content="SETUP_NONCE"><title>Pulse Server — первый запуск</title>
<style>body{font:17px system-ui;background:#10151f;color:#eaf0fa;margin:0}main{max-width:540px;margin:6vh auto;padding:28px;background:#1a2332;border-radius:16px}label{display:block;margin-top:20px}input[type=password],input[type=text]{box-sizing:border-box;width:100%;font:inherit;padding:12px;margin-top:8px}button{padding:13px 20px;font:inherit;margin-top:24px;cursor:pointer}#status{white-space:pre-wrap;color:#9de2c4}small{color:#bdc9dc}</style>
<main><h1>Настройка Pulse Server</h1><p>Создайте пароль администратора. В консоли ничего вводить не нужно.</p><p>Логин по умолчанию: <b>admin</b> (если не задан другой ADMIN_LOGIN). Пароля <b>admin</b> по умолчанию нет.</p><form id="form"><label for="password">Новый пароль</label><input id="password" type="password" autocomplete="new-password" required><small>12–72 байта UTF-8. Например, 12–72 латинских символа. Русские буквы обычно занимают 2 байта.</small><label for="confirm">Повторите пароль</label><input id="confirm" type="password" autocomplete="new-password" required><label><input type="checkbox" id="show"> Показать пароль</label><button id="save">Создать администратора и запустить сервер</button></form><p id="status" role="status" aria-live="polite"></p></main>
<script>
const $=id=>document.getElementById(id);$('show').onchange=()=>{for(const id of ['password','confirm'])$(id).type=$('show').checked?'text':'password'};
$('form').onsubmit=async e=>{e.preventDefault();const p=$('password').value,c=$('confirm').value,n=new TextEncoder().encode(p).length;if(n<12||n>72){$('status').textContent='Нужно от 12 до 72 байт UTF-8.';return}if(p!==c){$('status').textContent='Пароли не совпадают.';return}$('save').disabled=true;try{const r=await fetch('/setup',{method:'POST',headers:{'Content-Type':'application/json','X-Pulse-Setup':document.querySelector('meta[name="pulse-setup"]').content},body:JSON.stringify({password:p,confirm:c})});if(!r.ok)throw Error(await r.text());$('password').value='';$('confirm').value='';$('form').hidden=true;$('status').textContent='Пароль принят. Сервер запускается. Дождитесь строки Server listening on в консоли, затем откройте Pulse и войдите с созданным паролем. Эту вкладку можно закрыть.'}catch(e){$('status').textContent='Не удалось сохранить: '+e.message+' Если адрес недоступен, перезапустите Pulse Server и откройте новый SETUP адрес.';$('save').disabled=false}};
</script></html>
