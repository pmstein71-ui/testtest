<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пульс • Клиент</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10151f;color:#eaf0fa;font:16px system-ui}main{max-width:700px;margin:8vh auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center}small{color:#8fa1bd}h1{font-size:40px;margin-bottom:6px}.card{background:#1a2332;border:1px solid #304057;border-radius:18px;padding:28px;margin-top:28px}label{display:block;margin:18px 0 8px}input{width:100%;padding:13px;border-radius:8px;background:#101825;border:1px solid #455570;color:white;font:inherit}button{background:#82e2bd;border:0;border-radius:8px;padding:13px 20px;margin-top:20px;font:600 15px system-ui;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap;color:#aac6e8}a{color:#82e2bd}</style>
<main><header><b>◉ ПУЛЬС</b><small>Windows · Go + HTML</small></header><h1>Рабочее пространство</h1><small>Безопасное подключение к вашему серверу</small><section class="card" id="auth"><h2>Вход в систему</h2><form id="form"><label for="login">Логин</label><input id="login" autocomplete="username" required maxlength="128"><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Подключиться →</button></form></section><section class="card" id="profile" hidden><h2 id="welcome"></h2><p>Сеанс активен · база данных доступна</p><button id="logout">Выйти</button></section><p id="status" role="status"></p><section class="card"><b>Обновления приложения</b><p id="version">Проверяем GitHub Releases…</p><button id="check">Проверить обновления</button><button id="install" hidden>Скачать и установить</button></section></main>
<script>
let token='';const $=id=>document.getElementById(id);async function api(path,body){let r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'X-Pulse-Client':'1'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{let data=await api('/api/login',{login:$('login').value,password:$('password').value});token=data.token;$('password').value='';let me=await api('/api/me');$('welcome').textContent='Здравствуйте, '+me.login;$('auth').hidden=true;$('profile').hidden=false;$('status').textContent=me.message}catch(e){$('status').textContent=e.message}finally{$('submit').disabled=false}};
$('logout').onclick=async()=>{try{await api('/api/logout',{});token='';$('auth').hidden=false;$('profile').hidden=true;$('status').textContent='Вы вышли из системы'}catch(e){$('status').textContent=e.message}};
async function check(){try{let d=await api('/local/update');$('version').textContent='Установлена: '+d.current+(d.available?' · Доступна: '+d.latest:' · Обновлений нет');$('install').hidden=!d.available}catch(e){$('version').textContent='Не удалось проверить обновления: '+e.message}}
$('check').onclick=check;$('install').onclick=async()=>{if(!confirm('Скачать установщик из GitHub Releases и запустить обновление?'))return;$('install').disabled=true;try{await api('/local/install',{});$('version').textContent='Установщик запущен. Следуйте его инструкциям.'}catch(e){$('version').textContent=e.message}finally{$('install').disabled=false}};check();setInterval(check,3600000);
</script></html>
