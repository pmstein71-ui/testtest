name: Test and build Windows installer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: go mod tidy
      - run: gofmt -w cmd internal
      - run: go vet ./...
      - run: go test -race ./...
      - run: mkdir -p dist && go build -o dist/pulse-server ./cmd/server && go build -o dist/pulse-client ./cmd/client
      - run: python3 scripts/smoke.py
  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Build executables
        shell: pwsh
        run: |
          go mod tidy
          New-Item -ItemType Directory -Force dist
          $version = 'v0.0.0-preview'
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF_NAME }
          go build -trimpath -ldflags "-s -w -X github.com/pmstein71-ui/testtest/internal/release.Version=$version" -o dist/pulse-client.exe ./cmd/client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -ldflags '-s -w' -o dist/pulse-server.exe ./cmd/server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test setup and Windows code
        run: go test ./...
      - name: Smoke test Windows executables
        run: python scripts/smoke.py
      - name: Build setup.exe
        shell: pwsh
        run: |
          $version = '0.0.0'
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DAppVersion=$version" installer/setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash dist/setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  setup.exe" | Out-File dist/checksums.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*
      - name: Publish version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/setup.exe dist/checksums.txt dist/pulse-client.exe dist/pulse-server.exe --generate-notes --verify-tag
